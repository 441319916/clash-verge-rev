name: Build Clash Verge Rev Portable (Official Style)

on:
  workflow_dispatch: # 保留手动触发，方便你随时点击构建

permissions:
  contents: write

jobs:
  build-portable:
    runs-on: windows-latest
    env:
      TARGET: x86_64-pc-windows-msvc

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6 # 跟随官方升级到 v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0" # 严格对齐官方 Rust 版本
          targets: ${{ env.TARGET }}

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.14.0" # 严格对齐官方 Node 版本

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies & Auto Prebuild
        run: |
          pnpm i
          # 核心魔法：让官方脚本全自动下载内核、改名、算哈希、下规则库！
          pnpm run prebuild ${{ env.TARGET }}

      - name: Build Application (Executable Only)
        # 我们只要绿色版，不需要打包成 msi 或 exe 安装包，跳过 NSIS 打包避免插件报错
        run: pnpm tauri build --bundles none
        # (注：如果 --bundles none 报错，请改回 pnpm tauri build 并加上 continue-on-error: true)
        continue-on-error: true 

      - name: Assemble Portable Directory
        shell: pwsh
        run: |
          # 建立标准绿色版文件夹
          New-Item -ItemType Directory -Force -Path Clash-Verge-Portable\data
          New-Item -ItemType Directory -Force -Path Clash-Verge-Portable\resources
          
          # 提取官方脚本准备好的内核与规则库
          Copy-Item -Path "src-tauri\sidecar\verge-mihomo*.exe" -Destination "Clash-Verge-Portable\resources\"
          Copy-Item -Path "src-tauri\resources\*" -Destination "Clash-Verge-Portable\resources\" -Recurse
          
          # 提取编译好的主程序
          Copy-Item -Path "src-tauri\target\release\clash-verge.exe" -Destination "Clash-Verge-Portable\"
          
          # 打包为成品 ZIP
          Compress-Archive -Path "Clash-Verge-Portable\*" -DestinationPath "Clash-Verge-Portable.zip"

      - name: Upload Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: clash-verge-portable
          path: Clash-Verge-Portable.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-build-${{ github.run_number }}
          files: Clash-Verge-Portable.zip
