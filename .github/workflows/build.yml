name: Auto Build Clash Verge Rev

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          npm install -g pnpm
          pnpm install

      - name: Build
        run: |
          pnpm tauri build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: clash-verge-build
          path: src-tauri/target/release
