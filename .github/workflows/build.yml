name: Build Clash Verge Portable

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Prepare sidecar and resources
        shell: pwsh
        run: |
          # 创建目录
          New-Item -ItemType Directory -Force -Path src-tauri\sidecar
          New-Item -ItemType Directory -Force -Path src-tauri\resources
          New-Item -ItemType Directory -Force -Path src-tauri\config

          # 下载最新 Mihomo 内核
          Invoke-WebRequest -Uri https://github.com/MetaCubeX/mihomo/releases/latest/download/mihomo-windows-amd64-v1.19.21.zip -OutFile src-tauri\sidecar\mihomo.zip
          # 解压
          Expand-Archive -Path src-tauri\sidecar\mihomo.zip -DestinationPath src-tauri\sidecar -Force
          Remove-Item src-tauri\sidecar\mihomo.zip

          # 重命名内核可执行文件
          Rename-Item -Path src-tauri\sidecar\mihomo-windows-amd64.exe -NewName mihomo.exe

          # 下载规则数据库
          Invoke-WebRequest -Uri https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/geoip.metadb -OutFile src-tauri\resources\geoip.metadb
          Invoke-WebRequest -Uri https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/geosite.dat -OutFile src-tauri\resources\geosite.dat

          # 生成 config.yaml
          @"
mixed-port: 7897
socks-port: 7898
port: 7899
log-level: info
allow-lan: false
ipv6: true
mode: rule

core_path: ../sidecar/mihomo.exe
external-controller-pipe: \\.\pipe\verge-mihomo

tun:
  enable: false

secret: ""

external-controller-cors:
  allow-private-network: true
  allow-origins:
    - tauri://localhost
"@ | Out-File -Encoding UTF8 src-tauri\config\config.yaml

          # 生成 start.bat
          @"
@echo off
cd /d %~dp0
:: 提升管理员权限
net session >nul 2>&1
if %errorLevel% NEQ 0 (
    echo 正在以管理员权限重新启动...
    powershell -Command ""Start-Process -FilePath '%~f0' -Verb RunAs""
    exit /b
)
:: 启动 Clash Verge
start "" src-tauri\target\release\clash-verge.exe --app-dir=src-tauri
"@ | Out-File -Encoding ASCII src-tauri\start.bat

      - name: Verify files
        shell: pwsh
        run: |
          Get-ChildItem src-tauri\sidecar
          Get-ChildItem src-tauri\resources
          Get-ChildItem src-tauri\config
          Get-ChildItem src-tauri

      - name: Build application
        continue-on-error: true
        run: pnpm tauri build

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: clash-verge-portable
          path: |
            src-tauri\target\release\clash-verge.exe
            src-tauri\sidecar\mihomo.exe
            src-tauri\resources\geoip.metadb
            src-tauri\resources\geosite.dat
            src-tauri\config\config.yaml
            src-tauri\start.bat

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-build-${{ github.run_number }}
          files: |
            src-tauri\target\release\clash-verge.exe
            src-tauri\sidecar\mihomo.exe
            src-tauri\resources\geoip.metadb
            src-tauri\resources\geosite.dat
            src-tauri\config\config.yaml
            src-tauri\start.bat
