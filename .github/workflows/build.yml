name: Build Clash Verge Rev Portable

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Prepare sidecar and resources
        shell: pwsh
        run: |
          # 1. 创建必要的目录 (-Force 确保多次运行或目录已存在时不会报错)
          New-Item -ItemType Directory -Force -Path src-tauri\sidecar
          New-Item -ItemType Directory -Force -Path src-tauri\resources
          
          # 2. 下载并配置 Mihomo 核心 (使用 curl.exe 避免 PowerShell 内部别名冲突)
          curl.exe -L --retry 5 --retry-delay 5 https://github.com/MetaCubeX/mihomo/releases/download/v1.18.3/mihomo-windows-amd64.exe -o src-tauri\sidecar\verge-mihomo-x86_64-pc-windows-msvc.exe
          
          # 复制出 alpha 版本以满足 tauri.conf.json 的打包需求
          Copy-Item -Path src-tauri\sidecar\verge-mihomo-x86_64-pc-windows-msvc.exe -Destination src-tauri\sidecar\verge-mihomo-alpha-x86_64-pc-windows-msvc.exe
          
          # 3. 下载默认的 Geo 规则数据库到 resources 目录
          curl.exe -L --retry 5 --retry-delay 5 https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb -o src-tauri\resources\geoip.metadb
          curl.exe -L --retry 5 --retry-delay 5 https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat -o src-tauri\resources\geosite.dat

      - name: Verify files
        shell: pwsh
        run: |
          Get-ChildItem src-tauri\sidecar
          Get-ChildItem src-tauri\resources

      - name: Build application
        run: pnpm tauri build

      - name: Upload artifact (Portable)
        uses: actions/upload-artifact@v4
        with:
          name: clash-verge-portable
          # 抓取单文件主程序和官方打包输出的绿色版 zip 文件
          path: |
            src-tauri/target/release/clash-verge.exe
            src-tauri/target/release/bundle/**/*.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-build-${{ github.run_number }}
          files: |
            src-ta
